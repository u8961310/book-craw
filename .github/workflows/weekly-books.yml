name: Weekly Books Notification

on:
  schedule:
    # UTC 01:00 Monday = 台北時間 09:00 週一
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: "只用既有資料重建所有頁面（換版型用；不爬取、不寄信）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Prepare gh-pages directory
        run: |
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch --depth 1 "$REPO_URL" gh-pages-dir
          else
            mkdir -p gh-pages-dir
          fi

      - name: Rebuild pages only
        if: ${{ inputs.rebuild_only }}
        run: uv run python -m book_craw --rebuild ./gh-pages-dir

      - name: Run book-craw (email + pages)
        if: ${{ !inputs.rebuild_only }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: uv run python -m book_craw --pages ./gh-pages-dir

      - name: Deploy to gh-pages
        run: |
          cd gh-pages-dir
          if [ ! -d .git ]; then
            git init
            git checkout -b gh-pages
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Update book list $(date -I)"
            REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$REPO_URL"
            else
              git remote add origin "$REPO_URL"
            fi
            git push origin gh-pages
          fi
